name: llm-wiki

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://llm-wiki.hebler-betreuung.de}"
        WIKI_CONTENT_PATH: "${WIKI_CONTENT_PATH:-/app/content}"
    container_name: llm_wiki_frontend
    environment:
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://llm-wiki.hebler-betreuung.de}"
      WIKI_CONTENT_PATH: "${WIKI_CONTENT_PATH:-/app/content}"
      PORT: 3000
    # Kein Bind-Mount mehr: der Content liegt im Image (Dockerfile kopiert /app/content aus dem Build),
    # ein Image ist damit ein reproduzierbarer Inhaltsstand (Mac-Mini-Plan 6.3, 2026-10-11).
    restart: unless-stopped
    networks:
      - remote-proxy-network
      - local-dev-network

networks:
  remote-proxy-network:
    external: true
  local-dev-network:
    external: true
